services:
  database:
    image: postgres:17-alpine
    container_name: bakeitbaby-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakeitbaby}
      POSTGRES_USER: ${POSTGRES_USER:-bakeitbaby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakeitbaby}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - bakeitbaby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bakeitbaby_pgdata:
    name: bakeitbaby_pgdata
